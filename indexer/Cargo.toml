[package]
name = "soroban-indexer"
version = "0.1.0"
edition = "2021"

# Member of the root Cargo workspace: shared dependencies (sha2, hex, serde,
# sqlx, tokio, ...) are pinned once in the root `[workspace.dependencies]`, and
# the build uses the root `Cargo.lock` and `target/` directory.

[dependencies]
tokio.workspace = true
sqlx = { workspace = true, features = ["sqlite", "postgres", "chrono"] }
async-trait.workspace = true
anyhow = "1.0"
serde.workspace = true
serde_json.workspace = true
chrono = { workspace = true, features = ["serde"] }
dotenv.workspace = true
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2.workspace = true
hex.workspace = true
uuid = { version = "1.0", features = ["v4"] }
async-graphql = { version = "7.2", features = ["chrono", "dataloader", "apollo_persisted_queries", "boxed-trait"] }
async-graphql-axum = "7.2"
tokio-stream = { version = "0.1", features = ["sync"] }
